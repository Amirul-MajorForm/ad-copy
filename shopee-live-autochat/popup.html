<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 380px; margin: 0; padding: 12px; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; color: #222; }
    h1 { font-size: 15px; margin: 0; color: #ee4d2d; flex: 1; }
    #clientName { width: 120px; }
    body.tab { margin: 0 auto; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    label { font-weight: 600; display: block; margin: 10px 0 4px; }
    .hint { font-weight: 400; color: #777; font-size: 11px; }
    textarea { width: 100%; box-sizing: border-box; height: 80px; font: 12px inherit; }
    input[type=number] { width: 52px; }
    button { padding: 6px 10px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; }
    button.primary { background: #ee4d2d; color: #fff; border-color: #ee4d2d; }
    #status { padding: 6px 8px; border-radius: 4px; background: #f3f3f3; margin-bottom: 8px; }
    #status.on { background: #e7f6ec; color: #11692f; }
    #product { font-size: 12px; color: #444; margin-bottom: 8px; }
    #log { max-height: 140px; overflow-y: auto; font-size: 11px; border-top: 1px solid #eee; margin-top: 8px; padding-top: 6px; }
    #log div { margin-bottom: 4px; }
    .bad { color: #c0392b; }
  </style>
</head>
<body>
  <div class="row"><h1>Shopee Live Auto Chat</h1>
    <input id="clientName" placeholder="Client name" title="Which client this profile is for">
  </div>
  <div id="status">Stopped</div>
  <div id="product">Showing product: checking...</div>

  <div class="row">
    <button id="toggle" class="primary">Start</button>
    <button id="sendNow">Send one now</button>
    <button id="save">Save</button>
  </div>
  <div class="row">
    <button id="exportBtn">Export settings</button>
    <button id="importBtn">Import settings</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>

  <div class="row">
    Every <input id="intervalMinutes" type="number" min="1"> min, give or take
    <input id="jitterMinutes" type="number" min="0"> min
  </div>

  <div class="row">
    Mix in a general message every <input id="generalEvery" type="number" min="0"> messages
    <span class="hint">(0 = never)</span>
  </div>

  <label>Product tips <span class="hint">keyword in product name | tip. Fills {range} and {tip}</span></label>
  <textarea id="productTips" placeholder="Luminoforce | for coloured hair, protects colour while boosting shine"></textarea>

  <label>Product messages <span class="hint">used when a product is showing. {product} {price} {lowprice} {range} {tip}</span></label>
  <textarea id="productMessages"></textarea>

  <label>General messages <span class="hint">used when nothing is showing, and mixed in while a product is</span></label>
  <textarea id="generalMessages"></textarea>

  <label>Countdown messages <span class="hint">minutes left | message</span></label>
  <div class="row">Live length <input id="liveDurationMinutes" type="number" min="1"> min</div>
  <textarea id="countdownMessages"></textarea>
  <div class="hint">One message per line. Start a message with [pin] to pin it. Max 150 characters each.</div>

  <div id="log"></div>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
