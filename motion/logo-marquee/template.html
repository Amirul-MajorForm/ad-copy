<!-- MajorForm logo marquee. Paste this whole file into a Squarespace Code block
     with Display Source turned off. Rows alternate direction and loop forever;
     hovering pauses them. -->
<div class="mf-logos" role="region" aria-label="Brands we've worked with">
<!--ROWS-->
</div>
<style>
  .mf-logos {
    --mf-gap: clamp(48px, 6vw, 96px);
    display: grid;
    gap: clamp(28px, 4vw, 48px);
    padding-block: 12px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  .mf-logos__row { overflow: hidden; }
  .mf-logos__track { display: flex; width: max-content; will-change: transform; }
  .mf-logos__set { display: flex; align-items: center; gap: var(--mf-gap); padding-right: var(--mf-gap); }
  .mf-logos__set img { display: block; width: auto; max-width: none; opacity: 0.92; }
  .mf-logos.is-ready .mf-logos__track { animation: mf-logos-scroll var(--mf-dur, 40s) linear infinite; }
  .mf-logos__row[data-dir="right"] .mf-logos__track { animation-direction: reverse; }
  .mf-logos:hover .mf-logos__track { animation-play-state: paused; }
  @keyframes mf-logos-scroll { to { transform: translateX(calc(-1 * var(--mf-shift, 0px))); } }
  @media (prefers-reduced-motion: reduce) {
    .mf-logos { -webkit-mask-image: none; mask-image: none; }
    .mf-logos.is-ready .mf-logos__track { animation: none; width: auto; justify-content: center; }
    .mf-logos__set { flex-wrap: wrap; justify-content: center; padding-right: 0; row-gap: 28px; }
    .mf-logos__set[aria-hidden] { display: none; }
  }
</style>
<script>
(function () {
  document.querySelectorAll(".mf-logos:not([data-mf-init])").forEach(init);

  function init(root) {
  root.setAttribute("data-mf-init", "");
  var rows = root.querySelectorAll(".mf-logos__row");

  // Fill each row with copies of its logo set until it covers the row twice,
  // then scroll by exactly one set width so the loop is seamless.
  function layout() {
    rows.forEach(function (row) {
      var track = row.firstElementChild, set = track.firstElementChild;
      while (track.children.length > 1) track.removeChild(track.lastChild);
      var setW = set.offsetWidth;
      if (!setW) return;
      var copies = Math.ceil((row.offsetWidth * 2) / setW);
      for (var i = 1; i < Math.max(2, copies); i++) {
        var c = set.cloneNode(true);
        c.setAttribute("aria-hidden", "true");
        c.querySelectorAll("img").forEach(function (img) { img.alt = ""; });
        track.appendChild(c);
      }
      track.style.setProperty("--mf-shift", setW + "px");
      track.style.setProperty("--mf-dur", (setW / (parseFloat(row.dataset.speed) || 36)) + "s");
    });
    root.classList.add("is-ready");
  }

  var imgs = root.querySelectorAll("img");
  Promise.all(Array.prototype.map.call(imgs, function (img) {
    return img.decode ? img.decode().catch(function () {}) : Promise.resolve();
  })).then(function () {
    layout();
    var lastW = root.offsetWidth;
    if (window.ResizeObserver) new ResizeObserver(function () {
      if (Math.abs(root.offsetWidth - lastW) > 40) { lastW = root.offsetWidth; layout(); }
    }).observe(root);
  });
  }
})();
</script>
