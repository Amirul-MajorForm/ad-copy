<!-- MajorForm performance page: About facts (content and styling only).
     Paste into a Squarespace Code block under your About text, with Display Source turned off.
     The animations come from the Performance page code injection (paste once in Page Settings).
     data-theme="light" is for white sections; use "dark" on a dark section. -->
<div class="mf-facts" data-theme="light">
  <div class="mf-facts__list">
  <div class="mf-facts__row">
    <div><p class="mf-facts__num" data-count="10" data-suffix="+ years">10+ years</p><p class="mf-facts__lbl">of performance marketing experience</p></div>
    <div class="mf-facts__viz" data-viz="years" aria-hidden="true"></div>
  </div>
  <div class="mf-facts__row">
    <div><p class="mf-facts__num" data-count="30" data-suffix="+ brands">30+ brands</p><p class="mf-facts__lbl">leading and challenger brands we've worked with</p></div>
    <div class="mf-facts__viz" data-viz="brands" aria-hidden="true"></div>
  </div>
  <div class="mf-facts__row">
    <div><p class="mf-facts__num">One team</p><p class="mf-facts__lbl">strategy, creative, media, data</p></div>
    <div class="mf-facts__viz mf-facts__viz--team" data-viz="team" aria-hidden="true"></div>
  </div>
  </div>
</div>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,600&family=Space+Grotesk:wght@400;500&display=swap">
<style>
  .mf-facts { --num: #ffffff; --lbl: #a9a7b4; --rule: rgba(255, 255, 255, .16); --dot: #96d1aa; --dot2: #2fc2b6; --hot: #ffefae; --track: rgba(255, 255, 255, .18);
    width: 100%; color: var(--num); font-family: "Space Grotesk", system-ui, sans-serif; container-type: inline-size; }
  .mf-facts__list { display: grid; }
  /* Light theme for white sections: MajorForm navy numbers, deeper Antwerp (Wada 281) dots */
  .mf-facts[data-theme="light"] { --num: #233551; --lbl: #5d6270; --rule: rgba(35, 53, 81, .16); --dot: #7cc39a; --dot2: #00978d; --hot: #0a3261; --track: rgba(35, 53, 81, .18); }
  .mf-facts *, .mf-facts *::before, .mf-facts *::after { box-sizing: border-box; }
  .mf-facts__row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; border-top: 1px solid var(--rule); padding: 16px 0; }
  .mf-facts__row:last-child { border-bottom: 1px solid var(--rule); }
  .mf-facts .mf-facts__num { margin: 0; font-family: "DM Sans", "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: var(--mf-h2, clamp(34px, 3.4vw, 46px)); letter-spacing: -.04em; line-height: 1; color: var(--num); font-variant-numeric: tabular-nums; }
  /* Tight line height so two-line labels stay compact */
  .mf-facts .mf-facts__lbl { margin: 6px 0 0; font-size: 14px; line-height: 1.3; color: var(--lbl); max-width: 30ch; }

  .mf-facts__viz { position: relative; width: 170px; height: 56px; flex: none; }
  .mf-facts__viz i { position: absolute; border-radius: 50%; background: var(--dot); transform: scale(0); transition: transform .45s cubic-bezier(.3, 1.6, .5, 1), background .4s, opacity .4s; }
  .mf-facts__viz i.hot { background: var(--hot); }
  .mf-facts__viz i.teal { background: var(--dot2); }
  .mf-facts__viz i.line { left: 6px; right: 6px; top: 27px; height: 1px; border-radius: 0; background: var(--track); transform: scaleX(0); transform-origin: left; transition: transform .9s ease; }
  .mf-facts--play .mf-facts__viz i { transform: scale(1); }
  .mf-facts--play .mf-facts__viz i.line { transform: scaleX(1); }
  .mf-facts__viz--team i { transition: transform .5s cubic-bezier(.3, 1.6, .5, 1), left .8s cubic-bezier(.6, 0, .2, 1), top .8s cubic-bezier(.6, 0, .2, 1), opacity .4s, background .4s; }
  .mf-facts__viz--team em { position: absolute; font-style: normal; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--lbl); white-space: nowrap; opacity: 0; transition: opacity .4s; }
  .mf-facts--play .mf-facts__viz--team em { opacity: 1; }
  /* Narrow blocks: the animation moves under the text so the numbers stay on one line */
  .mf-facts .mf-facts__num { white-space: nowrap; }
  /* Layout follows the block's own width, in the editor as well as on the live site */
  @container (max-width: 439px) {
    .mf-facts__row { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .mf-facts .mf-facts__lbl { max-width: none; }
  }
  @container (min-width: 900px) {
    .mf-facts__list { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: clamp(24px, 4vw, 56px); }
    .mf-facts__row { grid-template-columns: minmax(0, 1fr); align-content: start; gap: 18px; padding: 20px 0 22px; border-bottom: 1px solid var(--rule); }
  }
  @media (prefers-reduced-motion: reduce) { .mf-facts__viz i, .mf-facts__viz--team em { transition: none; } }
</style>
