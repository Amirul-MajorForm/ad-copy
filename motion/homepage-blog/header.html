<!-- MajorForm homepage blog styles. Paste into the homepage's Page Settings > Advanced > Page Header Code Injection.

     Summary block settings: Design Grid, 12+ items, Primary metadata Categories, Secondary metadata Tags, metadata Above title. -->
<style>

  #block-yui_3_17_2_1_1755306803804_4200 .summary-thumbnail-container { display: block; position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; }

  body:has(#mf-bf-comm:checked) #block-yui_3_17_2_1_1755306803804_4200 .summary-item:not(:has(.summary-metadata-item--cats a[href*="category=Social"])) { display: none !important; }

  @media (prefers-reduced-motion: reduce) { #block-yui_3_17_2_1_1755306803804_4200 * { transition: none !important; } }
</style>
